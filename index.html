<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Mileage Updater</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c2430; --muted:#667085; --line:#e4e7ec;
          --ok:#127a3e; --okbg:#e7f6ec; --err:#b42318; --errbg:#fdecea; --warn:#9a6700; --warnbg:#fff4d6;
          --info:#175cd3; --infobg:#e8f0fe; --brand:#1d4ed8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:0 0 6px; font-size:14px; }
  select, input[type=file], input[type=text] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:16px; background:#fff; }
  .row { margin-bottom:14px; }
  .check { display:flex; gap:8px; align-items:center; font-size:14px; }
  .check input { width:18px; height:18px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:12px 18px; font-size:16px; font-weight:600; cursor:pointer; width:100%; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:#fff; color:var(--brand); border:1px solid var(--brand); width:auto; padding:8px 14px; font-size:14px; }
  button.small { width:auto; padding:6px 12px; font-size:13px; background:#b7791f; }
  .searchrow { display:flex; gap:8px; }
  .searchrow button { width:auto; white-space:nowrap; }
  .banner { padding:10px 12px; border-radius:8px; font-size:14px; margin:10px 0; }
  .banner.warn { background:var(--warnbg); color:var(--warn); }
  .banner.err { background:var(--errbg); color:var(--err); }
  .banner.ok { background:var(--okbg); color:var(--ok); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:12px; }
  .stat { border-radius:10px; padding:10px 12px; }
  .stat b { display:block; font-size:24px; }
  .stat span { font-size:13px; }
  .s-ok { background:var(--okbg); color:var(--ok); } .s-err { background:var(--errbg); color:var(--err); }
  .s-warn { background:var(--warnbg); color:var(--warn); } .s-info { background:var(--infobg); color:var(--info); }
  h2 { font-size:17px; margin:18px 0 8px; }
  h3 { font-size:15px; margin:14px 0 6px; }
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.msg { white-space:normal; min-width:240px; }
  th { background:#f9fafb; position:sticky; top:0; }
  tr:last-child td { border-bottom:0; }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .t-err { background:var(--errbg); color:var(--err); } .t-warn { background:var(--warnbg); color:var(--warn); }
  .t-ok { background:var(--okbg); color:var(--ok); } .t-info { background:var(--infobg); color:var(--info); }
  .ybox { background:#fffbea; border:1px solid #f3d27a; border-radius:10px; padding:12px; margin-top:18px; }
  .ybox h2 { margin-top:0; color:var(--warn); }
  .ybox .tablewrap { background:#fff; }
  .hit { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px; }
  .hit h3 { margin:0 0 8px; }
  .status { font-size:14px; color:var(--muted); margin-top:10px; min-height:20px; }
  .actions { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fleet Mileage Updater</h1>
  <div id="cfgBanner"></div>

  <!-- ===== Vehicle search ===== -->
  <div class="card">
    <label for="q">Search a vehicle</label>
    <div class="searchrow">
      <input id="q" type="text" placeholder="Vehicle number" autocomplete="off">
      <button id="sbtn">Search</button>
    </div>
    <div id="sstatus" class="status"></div>
    <div id="sresults"></div>
  </div>

  <!-- ===== Work station ===== -->
  <div class="card">
    <div class="row">
      <label for="wh">Warehouse</label>
      <select id="wh"></select>
    </div>
    <div class="row">
      <label for="file">Mileage file (Excel with vehicle number + mileage)</label>
      <input id="file" type="file" accept=".xlsx,.xls,.csv">
    </div>
    <div class="row check">
      <input id="dry" type="checkbox">
      <label for="dry" style="margin:0;font-weight:500">Preview only (check for errors, don't write to the sheet)</label>
    </div>
    <button id="go">Process &amp; Update</button>
    <div id="status" class="status"></div>
  </div>

  <div id="results"></div>
</div>

<script>
/* ============================ CONFIGURATION ============================
   1. GOOGLE_CLIENT_ID: OAuth Web client ID from Google Cloud Console.
   2. WAREHOUSES: the 7 sheets that can be READ and UPDATED (shown in the dropdown).
      display name -> Google Sheet ID. "tab" is optional: leave "" to use the first tab.
   3. READ_ONLY_SHEETS: sheets that are only READ (search + "wrong warehouse" lookup).
      They never appear in the dropdown and are never written to.
   4. Header names: columns are found by these header names (case-insensitive).
*/
const CONFIG = {
  GOOGLE_CLIENT_ID: "898500084346-jfu3c4fdnqbg08q7qgq7o9s43361iso3.apps.googleusercontent.com",
  WAREHOUSES: {
    "Zahle": { sheetId: "1Aaqb5PYOLce4fgsltVcId4sjh-VaSHqa385hGXDydXY", tab: "" },
    "Balamand": { sheetId: "1Q3_l9B3qA3MmU58IopFq_Dcp4rFtTiqkpyZF834M_Sk", tab: "" },
    "Jbeil": { sheetId: "1nomCO2IDmEsxsOPxy2RxIp6rKTy7J2s98SzGVDXnMeo", tab: "" },
    "Choueifat": { sheetId: "1jY0f4wrCFG1kJyQTAYT6amOvd7h8qewZiC9rr0QXeWs", tab: "" },
    "Barouk": { sheetId: "1kPSwmpMki3ZxWdAQVsr8zDsT5z76Znm2eu0b-evSpM8", tab: "" },
    "Hazmieh": { sheetId: "1zDKmVgewox6LzJLKvCBSAPaB6n4-lGKhxey7u8jq3g4", tab: "" },
    "Akbieh": { sheetId: "1q1wFGkoyVpAW402NrhyzWm8XotxhFLoMPv6W36I2c5E", tab: "" }
  },
  READ_ONLY_SHEETS: {
    "Read-only sheet": { sheetId: "PASTE_READONLY_SHEET_ID", tab: "" }
  },
  VEHICLE_HEADERS: ["vehicle number", "vehicle no", "vehicle no.", "vehicle", "vehicle #", "plate", "plate number", "plate no"],
  MILEAGE_HEADERS: ["mileage", "km", "kilometers", "odometer", "current mileage", "milage"],
  MAX_INCREASE: 2000
};

/* ============================ HELPERS ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const normVehicle = v => String(v ?? "").trim().toUpperCase().replace(/\s+/g, "");
const normHeader = v => String(v ?? "").trim().toLowerCase().replace(/\s+/g, " ");
const fmt = n => (typeof n === "number" ? n.toLocaleString("en-US") : n);

function parseMileage(v) {
  if (typeof v === "number") return isFinite(v) ? v : NaN;
  if (v === null || v === undefined) return NaN;
  const s = String(v).trim().replace(/[,\s]/g, "");
  if (s === "" || !/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}

function colLetter(i) { // 0 -> A
  let s = ""; i++;
  while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

/* needMileage=false: only the vehicle column is required (used for search / read-only sheets) */
function findHeaderRow(rows, needMileage = true, maxScan = 15) {
  for (let r = 0; r < Math.min(rows.length, maxScan); r++) {
    const row = rows[r] || [];
    let vc = -1, mc = -1;
    row.forEach((cell, c) => {
      const h = normHeader(cell);
      if (vc < 0 && CONFIG.VEHICLE_HEADERS.includes(h)) vc = c;
      if (mc < 0 && CONFIG.MILEAGE_HEADERS.includes(h)) mc = c;
    });
    if (vc >= 0 && (!needMileage || mc >= 0)) return { headerRow: r, vehicleCol: vc, mileageCol: mc };
  }
  return null;
}

function buildIndex(rows, hdr) {
  const index = new Map();
  for (let r = hdr.headerRow + 1; r < rows.length; r++) {
    const k = normVehicle((rows[r] || [])[hdr.vehicleCol]);
    if (!k) continue;
    if (!index.has(k)) index.set(k, []);
    index.get(k).push(r);
  }
  return index;
}

/* ============================ CORE LOGIC (pure) ============================ */
/* Step 1: read uploaded rows, merge duplicates (keep highest mileage). */
function readUpload(rows) {
  const issues = [];
  const duplicates = [];
  let hdr = findHeaderRow(rows);
  let start, vc, mc;
  if (hdr) { start = hdr.headerRow + 1; vc = hdr.vehicleCol; mc = hdr.mileageCol; }
  else { vc = 0; mc = 1; start = isNaN(parseMileage((rows[0] || [])[1])) ? 1 : 0; }
  const map = new Map();
  for (let r = start; r < rows.length; r++) {
    const row = rows[r] || [];
    const rawV = row[vc], rawM = row[mc];
    const blankV = String(rawV ?? "").trim() === "", blankM = String(rawM ?? "").trim() === "";
    if (blankV && blankM) continue;
    const excelRow = r + 1;
    if (blankV) { issues.push({ type: "Missing vehicle number", vehicle: "(blank)", uploadRow: excelRow, mileage: rawM, detail: `Row ${excelRow} of the uploaded file has a mileage (${rawM}) but no vehicle number.` }); continue; }
    const m = parseMileage(rawM);
    if (isNaN(m)) { issues.push({ type: "Invalid mileage in upload", vehicle: String(rawV).trim(), uploadRow: excelRow, mileage: rawM, detail: `Row ${excelRow} of the uploaded file: mileage "${rawM ?? ""}" is not a valid number.` }); continue; }
    const key = normVehicle(rawV);
    if (!map.has(key)) map.set(key, { display: String(rawV).trim(), entries: [] });
    map.get(key).entries.push({ row: excelRow, mileage: m });
  }
  const vehicles = [];
  for (const [key, v] of map) {
    let best = v.entries[0];
    v.entries.forEach(e => { if (e.mileage > best.mileage) best = e; });
    vehicles.push({ key, display: v.display, mileage: best.mileage, uploadRow: best.row });
    if (v.entries.length > 1) {
      duplicates.push({ vehicle: v.display, kept: best.mileage,
        detail: `Appeared ${v.entries.length} times in the upload (rows ${v.entries.map(e => e.row).join(", ")}) with mileages ${v.entries.map(e => fmt(e.mileage)).join(", ")}. Kept the highest: ${fmt(best.mileage)}.` });
    }
  }
  return { vehicles, issues, duplicates, usedFallback: !hdr };
}

/* Rules: new must be higher than old, and not more than MAX_INCREASE above it. */
function check(newM, rawOld) {
  const has = String(rawOld ?? "").trim() !== "";
  if (!has) return { st: "empty" };
  const old = parseMileage(rawOld);
  if (isNaN(old)) return { st: "unreadable", raw: rawOld };
  const diff = newM - old;
  if (diff < 0) return { st: "lower", old, diff };
  if (diff === 0) return { st: "same", old, diff };
  if (diff > CONFIG.MAX_INCREASE) return { st: "high", old, diff };
  return { st: "ok", old, diff };
}

function problemText(v, c, cell, sheetRow, where) {
  const w = where ? ` in "${where}"` : " in the warehouse";
  if (c.st === "unreadable") return `Vehicle ${v.display}: current mileage${w} cell ${cell} is "${c.raw}" which is not a number. New mileage ${fmt(v.mileage)} was not written.`;
  if (c.st === "lower") return `Vehicle ${v.display}: new mileage ${fmt(v.mileage)} (upload row ${v.uploadRow}) is LOWER than current ${fmt(c.old)}${w} cell ${cell} (sheet row ${sheetRow}). Difference: ${fmt(c.diff)}.`;
  if (c.st === "high") return `Vehicle ${v.display}: new mileage ${fmt(v.mileage)} (upload row ${v.uploadRow}) is ${fmt(c.diff)} higher than current ${fmt(c.old)}${w} cell ${cell} (sheet row ${sheetRow}). Maximum allowed increase is ${fmt(CONFIG.MAX_INCREASE)}.`;
  return "";
}

const ERR_TYPE = { unreadable: "Old mileage unreadable", lower: "Mileage lower than old", high: "Mileage too high" };

/* Step 2: compare against one warehouse sheet's values (UNFORMATTED). */
function compare(vehicles, sheetRows) {
  const hdr = findHeaderRow(sheetRows);
  if (!hdr) throw new Error("Could not find the vehicle number and mileage column headers in the warehouse sheet (looked in the first 15 rows). Check the header names in CONFIG.");
  const { vehicleCol, mileageCol } = hdr;
  const index = buildIndex(sheetRows, hdr);
  const updates = [], errors = [], unchanged = [], notFound = [];
  for (const v of vehicles) {
    const hits = index.get(v.key);
    if (!hits) { notFound.push(v); continue; }
    if (hits.length > 1) { errors.push({ key: v.key, type: "Duplicate vehicle in warehouse", vehicle: v.display, uploadRow: v.uploadRow, mileage: v.mileage, detail: `Vehicle ${v.display} appears ${hits.length} times in the warehouse sheet (rows ${hits.map(h => h + 1).join(", ")}). Not updated - fix the sheet first.` }); continue; }
    const r = hits[0], sheetRow = r + 1;
    const cell = `${colLetter(mileageCol)}${sheetRow}`;
    const c = check(v.mileage, (sheetRows[r] || [])[mileageCol]);
    if (c.st === "empty") { updates.push({ key: v.key, vehicle: v.display, old: "(empty)", next: v.mileage, diff: "-", cell, sheetRow, note: "Old mileage was empty, written without checks" }); continue; }
    if (c.st === "same") { unchanged.push({ key: v.key, vehicle: v.display, old: c.old, cell, detail: `Vehicle ${v.display}: new mileage equals the current mileage (${fmt(c.old)}). Nothing changed.` }); continue; }
    if (c.st === "ok") { updates.push({ key: v.key, vehicle: v.display, old: c.old, next: v.mileage, diff: c.diff, cell, sheetRow, note: "" }); continue; }
    errors.push({ key: v.key, type: ERR_TYPE[c.st], vehicle: v.display, uploadRow: v.uploadRow, mileage: v.mileage, detail: problemText(v, c, cell, sheetRow, "") });
  }
  return { updates, errors, unchanged, notFound };
}

/* ============================ GOOGLE API ============================ */
let accessToken = null, tokenClient = null, tokenExpiry = 0;

function getToken() {
  return new Promise((resolve, reject) => {
    if (accessToken && Date.now() < tokenExpiry - 30000) return resolve(accessToken);
    if (!window.google || !google.accounts) return reject(new Error("Google sign-in library did not load. Check your internet connection."));
    if (!tokenClient) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.GOOGLE_CLIENT_ID,
        scope: "https://www.googleapis.com/auth/spreadsheets",
        callback: () => {}
      });
    }
    tokenClient.callback = resp => {
      if (resp.error) return reject(new Error("Google sign-in failed: " + resp.error));
      accessToken = resp.access_token; tokenExpiry = Date.now() + (resp.expires_in || 3600) * 1000;
      resolve(accessToken);
    };
    tokenClient.requestAccessToken({ prompt: accessToken ? "" : "consent" });
  });
}

async function gfetch(url, opts = {}) {
  const t = await getToken();
  const res = await fetch(url, { ...opts, headers: { Authorization: "Bearer " + t, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = j.error?.message || msg; } catch (e) {}
    if (res.status === 400 && /not supported for this document/i.test(msg))
      msg += " (This file is an uploaded .xlsx stored in Drive. Open it and use File > Save as Google Sheets.)";
    throw new Error(`Google API error ${res.status}: ${msg}`);
  }
  return res.json();
}

async function loadSheet(cfg, render = "UNFORMATTED_VALUE") {
  let tab = cfg.tab;
  if (!tab) {
    const meta = await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}?fields=sheets.properties.title`);
    tab = meta.sheets[0].properties.title;
  }
  const q = "'" + tab.replace(/'/g, "''") + "'";
  const data = await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}/values/${encodeURIComponent(q)}?valueRenderOption=${render}`);
  return { tab, q, rows: data.values || [] };
}

async function writeUpdates(cfg, q, updates) {
  const CHUNK = 500;
  for (let i = 0; i < updates.length; i += CHUNK) {
    const part = updates.slice(i, i + CHUNK);
    await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}/values:batchUpdate`, {
      method: "POST",
      body: JSON.stringify({ valueInputOption: "RAW", data: part.map(u => ({ range: `${q}!${u.cell}`, values: [[u.next]] })) })
    });
  }
}

/* All configured sheets: 7 read/write + read-only ones. Unconfigured (PASTE...) ones are skipped. */
function allSheets() {
  const list = [];
  for (const [name, cfg] of Object.entries(CONFIG.WAREHOUSES)) list.push({ name, cfg, readOnly: false });
  for (const [name, cfg] of Object.entries(CONFIG.READ_ONLY_SHEETS || {})) list.push({ name, cfg, readOnly: true });
  return list.filter(s => s.cfg.sheetId && !s.cfg.sheetId.startsWith("PASTE"));
}

/* Load several sheets in parallel; a failing sheet does not stop the others. */
async function scanSheets(sheets, render, needMileage) {
  await getToken(); // sign in once, before the parallel loads
  return Promise.all(sheets.map(async s => {
    try {
      const d = await loadSheet(s.cfg, render);
      const hdr = findHeaderRow(d.rows, needMileage && !s.readOnly);
      if (!hdr) throw new Error("could not find the vehicle number" + (needMileage && !s.readOnly ? " and mileage" : "") + " column header (looked in the first 15 rows)");
      return { s, d, hdr, index: buildIndex(d.rows, hdr) };
    } catch (e) { return { s, error: e.message }; }
  }));
}

/* ============================ UI ============================ */
let lastReport = null;   // { name, dry, up, cmp, wrong, failedSheets, fileName }
let wrong = [];          // wrong-warehouse items (see run())

function init() {
  const sel = $("wh");
  Object.keys(CONFIG.WAREHOUSES).forEach(n => { const o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o); });
  const notConfigured = CONFIG.GOOGLE_CLIENT_ID.startsWith("PASTE") ||
    Object.values(CONFIG.WAREHOUSES).every(w => w.sheetId.startsWith("PASTE"));
  if (notConfigured) $("cfgBanner").innerHTML = `<div class="banner warn">Setup needed: fill in GOOGLE_CLIENT_ID and the Sheet IDs in the CONFIG section at the top of the script.</div>`;
  $("go").addEventListener("click", run);
  $("sbtn").addEventListener("click", runSearch);
  $("q").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });
  $("results").addEventListener("click", onResultsClick);
}

function setStatus(t) { $("status").textContent = t; }

function table(cols, rows) {
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c.h)}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr>${cols.map(c => `<td class="${c.cls || ""}">${c.f(r)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`;
}

/* ---------- Search ---------- */
async function runSearch() {
  const raw = $("q").value.trim();
  const key = normVehicle(raw);
  $("sresults").innerHTML = "";
  if (!key) { $("sstatus").textContent = "Type a vehicle number first."; return; }
  const sheets = allSheets();
  if (!sheets.length) { $("sstatus").textContent = "No sheets are configured yet (see CONFIG)."; return; }
  $("sbtn").disabled = true;
  try {
    $("sstatus").textContent = `Searching ${sheets.length} sheets...`;
    const scans = await scanSheets(sheets, "FORMATTED_VALUE", false);
    $("sstatus").textContent = "";
    renderSearch(scans, raw, key);
  } catch (e) {
    $("sstatus").textContent = "";
    $("sresults").innerHTML = `<div class="banner err"><b>Search stopped:</b> ${esc(e.message)}</div>`;
  } finally { $("sbtn").disabled = false; }
}

function renderSearch(scans, raw, key) {
  const failed = scans.filter(x => x.error);
  const hits = [];
  scans.forEach(sc => { if (sc.error) return; (sc.index.get(key) || []).forEach(r => hits.push({ sc, r })); });
  let html = "";
  if (!hits.length) html += `<div class="banner err">Vehicle <b>${esc(raw)}</b> was not found in any sheet.</div>`;
  else {
    html += `<div class="banner ok">Found <b>${esc(raw)}</b> in ${hits.length} place${hits.length > 1 ? "s" : ""}.</div>`;
    const rows = hits.map(({ sc, r }) => {
      const mc = sc.hdr.mileageCol;
      const m = mc >= 0 ? String((sc.d.rows[r] || [])[mc] ?? "").trim() : "";
      return { loc: sc.s.name, ro: sc.s.readOnly, mileage: m, row: r + 1 };
    });
    html += table([
      { h: "Location", f: p => esc(p.loc) + (p.ro ? ' <span class="tag t-info">read-only</span>' : "") },
      { h: "Mileage", f: p => (p.mileage === "" ? "<span style='color:var(--muted)'>not available</span>" : "<b>" + esc(p.mileage) + "</b>") },
      { h: "Sheet row", f: p => esc(p.row) }
    ], rows);
  }
  if (failed.length) html += `<div class="banner warn"><b>Could not check:</b> ${failed.map(f => `${esc(f.s.name)} (${esc(f.error)})`).join("; ")}. The result above may be incomplete.</div>`;
  $("sresults").innerHTML = html;
}

/* ---------- Upload & update ---------- */
async function readFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
}

async function run() {
  const file = $("file").files[0];
  const name = $("wh").value;
  const dry = $("dry").checked;
  $("results").innerHTML = "";
  wrong = [];
  if (!file) { setStatus("Please choose an Excel file first."); return; }
  const w = CONFIG.WAREHOUSES[name];
  $("go").disabled = true;
  try {
    setStatus("Reading uploaded file...");
    const upRows = await readFile(file);
    const up = readUpload(upRows);
    if (!up.vehicles.length && !up.issues.length) throw new Error("No vehicle rows were found in the uploaded file.");

    setStatus("Signing in to Google and loading " + name + "...");
    const wh = await loadSheet(w);
    const cmp = compare(up.vehicles, wh.rows);

    if (!dry && cmp.updates.length) {
      setStatus(`Writing ${cmp.updates.length} updates to ${name}...`);
      await writeUpdates(w, wh.q, cmp.updates);
    }

    /* Vehicles not in this warehouse: look for them in all the other sheets */
    let failedSheets = [];
    if (cmp.notFound.length) {
      setStatus(`Looking for ${cmp.notFound.length} vehicle(s) in the other sheets...`);
      const others = allSheets().filter(s => s.name !== name);
      const scans = await scanSheets(others, "UNFORMATTED_VALUE", true);
      failedSheets = scans.filter(x => x.error).map(x => ({ name: x.s.name, error: x.error }));
      for (const v of cmp.notFound) {
        let found = false;
        for (const sc of scans) {
          if (sc.error) continue;
          const hits = sc.index.get(v.key);
          if (!hits) continue;
          found = true;
          for (const r of hits) {
            const item = { key: v.key, vehicle: v.display, mileage: v.mileage, uploadRow: v.uploadRow, sheetName: sc.s.name, readOnly: sc.s.readOnly, sheetRow: r + 1, old: "", cell: "", status: "", msg: "", ambiguous: false };
            const mc = sc.hdr.mileageCol;
            if (mc >= 0) { item.cell = `${colLetter(mc)}${r + 1}`; }
            const rawOld = mc >= 0 ? (sc.d.rows[r] || [])[mc] : undefined;
            if (sc.s.readOnly) {
              item.status = "readonly"; item.old = rawOld ?? "";
              item.msg = `Found in read-only sheet "${sc.s.name}" (row ${r + 1}${mc >= 0 ? ", current mileage " + fmt(rawOld ?? "") : ""}). It cannot be updated from this site.`;
            } else {
              const c = check(v.mileage, rawOld);
              item.old = c.st === "empty" ? "(empty)" : (c.old ?? c.raw);
              if (c.st === "ok") { item.status = "actionable"; item.msg = `Would change ${fmt(c.old)} to ${fmt(v.mileage)} (+${fmt(c.diff)}) in cell ${item.cell}.`; }
              else if (c.st === "empty") { item.status = "actionable"; item.msg = `Current mileage is empty; ${fmt(v.mileage)} would be written to cell ${item.cell}.`; }
              else if (c.st === "same") { item.status = "same"; item.msg = `Mileage equals the current one (${fmt(c.old)}). Nothing to update.`; }
              else { item.status = "blocked"; item.msg = problemText(v, c, item.cell, r + 1, sc.s.name); }
            }
            wrong.push(item);
          }
        }
        if (!found) {
          const note = failedSheets.length ? ` Note: these sheets could not be checked: ${failedSheets.map(f => f.name).join(", ")}.` : "";
          cmp.errors.push({ key: v.key, type: "Vehicle not available", vehicle: v.display, uploadRow: v.uploadRow, mileage: v.mileage,
            detail: `Vehicle ${v.display} (mileage ${fmt(v.mileage)}, upload row ${v.uploadRow}) was not found in ${name} nor in any other sheet.${note}` });
        }
      }
      /* a vehicle that could be updated in more than one sheet must be chosen by hand */
      const counts = {};
      wrong.filter(i => i.status === "actionable").forEach(i => counts[i.key] = (counts[i.key] || 0) + 1);
      wrong.forEach(i => { if (i.status === "actionable" && counts[i.key] > 1) { i.ambiguous = true; i.msg += " This vehicle exists in more than one sheet - choose the right one."; } });
    }

    setStatus(dry ? "Preview finished. Nothing was written." : "Done.");
    lastReport = { name, dry, up, cmp, failedSheets, fileName: file.name };
    render(lastReport);
  } catch (e) {
    console.error(e);
    setStatus("");
    $("results").innerHTML = `<div class="card"><div class="banner err"><b>Stopped:</b> ${esc(e.message)}<br>Nothing was written to the sheet.</div></div>`;
  } finally { $("go").disabled = false; }
}

function render(rep) {
  const { up, cmp, name, dry, failedSheets } = rep;
  const allErrors = [...up.issues, ...cmp.errors];
  let h = `<div class="card"><h2 style="margin-top:0">${dry ? "Preview" : "Result"} for ${esc(name)}</h2>`;
  if (up.usedFallback) h += `<div class="banner warn">Header names were not recognised in the uploaded file, so columns A (vehicle) and B (mileage) were used.</div>`;
  if (failedSheets.length) h += `<div class="banner warn"><b>Could not check these sheets for wrong-warehouse matches:</b> ${failedSheets.map(f => `${esc(f.name)} (${esc(f.error)})`).join("; ")}.</div>`;
  h += `<div class="stats">
    <div class="stat s-ok"><b>${cmp.updates.length}</b><span>${dry ? "Would be updated" : "Updated"}</span></div>
    <div class="stat s-err"><b>${allErrors.length}</b><span>Errors</span></div>
    <div class="stat s-warn"><b id="wrongCount">${wrong.length}</b><span>Wrong warehouse</span></div>
    <div class="stat s-warn"><b>${up.duplicates.length}</b><span>Duplicates merged</span></div>
    <div class="stat s-info"><b>${cmp.unchanged.length}</b><span>Unchanged</span></div></div>
    <div class="actions"><button class="secondary" id="dl">Download report (CSV)</button></div>`;

  if (allErrors.length) {
    h += `<h2>Errors - check these</h2>` + table([
      { h: "Type", f: r => `<span class="tag t-err">${esc(r.type)}</span>` },
      { h: "Vehicle", f: r => esc(r.vehicle) },
      { h: "Details", f: r => esc(r.detail), cls: "msg" }
    ], allErrors);
  } else h += `<div class="banner ok">No errors.</div>`;

  h += `<div id="wrongBox"></div>`;

  if (up.duplicates.length) h += `<h2>Duplicates in upload (highest kept)</h2>` + table([
    { h: "Vehicle", f: r => esc(r.vehicle) }, { h: "Details", f: r => esc(r.detail), cls: "msg" }], up.duplicates);

  if (cmp.updates.length) h += `<h2>${dry ? "Would be updated" : "Updated"} in ${esc(name)}</h2>` + table([
    { h: "Vehicle", f: r => esc(r.vehicle) }, { h: "Old", f: r => esc(fmt(r.old)) }, { h: "New", f: r => esc(fmt(r.next)) },
    { h: "Diff", f: r => esc(fmt(r.diff)) }, { h: "Cell", f: r => esc(r.cell) }, { h: "Note", f: r => esc(r.note), cls: "msg" }], cmp.updates);

  if (cmp.unchanged.length) h += `<h2>Unchanged (same mileage)</h2>` + table([
    { h: "Vehicle", f: r => esc(r.vehicle) }, { h: "Details", f: r => esc(r.detail), cls: "msg" }], cmp.unchanged);

  h += `</div>`;
  $("results").innerHTML = h;
  $("dl").addEventListener("click", downloadReport);
  renderWrong();
}

/* ---------- Yellow "Wrong warehouse" section ---------- */
function renderWrong() {
  const box = $("wrongBox");
  if (!box) return;
  const dry = lastReport && lastReport.dry;
  const wc = $("wrongCount"); if (wc) wc.textContent = wrong.length;
  if (!wrong.length) { box.innerHTML = ""; return; }
  const pending = wrong.map((it, i) => ({ it, i })).filter(x => x.it.status === "actionable" && !x.it.ambiguous);
  let h = `<div class="ybox"><h2>Wrong warehouse</h2>
    <p style="margin:0 0 10px;font-size:14px">These vehicles are not in the selected warehouse but exist in another sheet. Nothing is changed there unless you press <b>Yes, update</b>.</p>`;
  if (dry) h += `<div class="banner warn">Preview mode is on: updating is disabled. Untick "Preview only" and run again to update.</div>`;
  if (pending.length > 1) h += `<div class="actions"><button class="small" data-act="all" ${dry ? "disabled" : ""}>Yes, update all (${pending.length})</button></div>`;
  h += table([
    { h: "Vehicle", f: r => esc(r.vehicle) },
    { h: "Found in", f: r => esc(r.sheetName) + (r.readOnly ? ' <span class="tag t-info">read-only</span>' : "") },
    { h: "Sheet row", f: r => esc(r.sheetRow) },
    { h: "Current", f: r => esc(fmt(r.old)) },
    { h: "New", f: r => esc(fmt(r.mileage)) },
    { h: "Details", f: r => esc(r.msg), cls: "msg" },
    { h: "Update?", f: r => actionCell(r, dry) }
  ], wrong.map((it, i) => Object.assign({}, it, { idx: i })));
  h += `</div>`;
  box.innerHTML = h;
}

function actionCell(r, dry) {
  switch (r.status) {
    case "actionable": return `<button class="small" data-act="one" data-idx="${r.idx}" ${dry ? "disabled" : ""}>Yes, update</button>`;
    case "blocked": return `<span class="tag t-err">Cannot update</span>`;
    case "same": return `<span class="tag t-info">Unchanged</span>`;
    case "readonly": return `<span class="tag t-info">Read-only</span>`;
    case "done": return `<span class="tag t-ok">Updated</span>`;
    case "failed": return `<span class="tag t-err">Failed</span>`;
  }
  return "";
}

function onResultsClick(e) {
  const b = e.target.closest("button[data-act]");
  if (!b || b.disabled) return;
  if (b.dataset.act === "one") confirmUpdate([Number(b.dataset.idx)]);
  if (b.dataset.act === "all") confirmUpdate(wrong.map((it, i) => i).filter(i => wrong[i].status === "actionable" && !wrong[i].ambiguous));
}

/* Only runs after the person pressed "Yes". Re-reads the sheet and re-checks the rules before writing. */
async function confirmUpdate(idxs) {
  const items = idxs.map(i => wrong[i]).filter(it => it && it.status === "actionable");
  if (!items.length) return;
  $("wrongBox").querySelectorAll("button").forEach(b => b.disabled = true);
  const bySheet = new Map();
  items.forEach(it => { if (!bySheet.has(it.sheetName)) bySheet.set(it.sheetName, []); bySheet.get(it.sheetName).push(it); });
  for (const [sn, its] of bySheet) {
    try {
      const s = allSheets().find(x => x.name === sn && !x.readOnly);
      if (!s) throw new Error("This sheet is read-only or not configured, so it cannot be updated.");
      const d = await loadSheet(s.cfg);
      const res = compare(its.map(it => ({ key: it.key, display: it.vehicle, mileage: it.mileage, uploadRow: it.uploadRow })), d.rows);
      if (res.updates.length) await writeUpdates(s.cfg, d.q, res.updates);
      for (const it of its) {
        const u = res.updates.find(x => x.key === it.key), er = res.errors.find(x => x.key === it.key), sm = res.unchanged.find(x => x.key === it.key);
        if (u) { it.status = "done"; it.msg = `Updated ${fmt(u.old)} to ${fmt(u.next)} in "${sn}", cell ${u.cell}.`; }
        else if (er) { it.status = "failed"; it.msg = er.detail; }
        else if (sm) { it.status = "same"; it.msg = sm.detail; }
        else { it.status = "failed"; it.msg = `Vehicle ${it.vehicle} was no longer found in "${sn}".`; }
      }
    } catch (e) { its.forEach(it => { it.status = "failed"; it.msg = e.message; }); }
  }
  renderWrong();
}

function downloadReport() {
  const { up, cmp, name, dry } = lastReport;
  const rows = [["Category", "Type", "Vehicle", "Details"]];
  [...up.issues, ...cmp.errors].forEach(e => rows.push(["ERROR", e.type, e.vehicle, e.detail]));
  wrong.forEach(w => rows.push(["WRONG WAREHOUSE", w.status, w.vehicle, `${w.sheetName}: ${w.msg}`]));
  up.duplicates.forEach(d => rows.push(["DUPLICATE", "Merged", d.vehicle, d.detail]));
  cmp.updates.forEach(u => rows.push([dry ? "WOULD UPDATE" : "UPDATED", "", u.vehicle, `${u.old} -> ${u.next} (diff ${u.diff}) cell ${u.cell} ${u.note}`]));
  cmp.unchanged.forEach(u => rows.push(["UNCHANGED", "", u.vehicle, u.detail]));
  const csv = rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
  a.download = `mileage-report-${name.replace(/\W+/g, "_")}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}

init();
</script>
</body>
</html>
